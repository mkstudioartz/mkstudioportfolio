<!-- =========================================MODAL========================================= -->
        <div id="image-modal" class="image-modal" onclick="closeModal(event)">

            <!-- VIDEO FOR EVERY LIVING MEMORY -->

                <source id="expanded-video-source" src="#" type="video/mp4">
            </video>

<!-- =========================================JAVASCRIPT ========================================= -->

<script>
function openModal(item) {
    const modal =
        document.getElementById("image-modal");
    const expandedImage =
        document.getElementById("expanded-image");
    const expandedVideo =
        document.getElementById("expanded-video");
    const videoSource =
        document.getElementById("expanded-video-source");
    const videoPath =
        item.getAttribute("data-video");

    /* =====================================VIDEO PROJECT===================================== */

    if (videoPath) {
        expandedImage.style.display = "none";
        videoSource.src = videoPath;
        expandedVideo.load();
        expandedVideo.style.display = "block";
        expandedVideo.play();
    }


    /* =====================================IMAGE PROJECT===================================== */
    else {
        const image = item.querySelector("img");
        expandedImage.src = image.src;
        expandedImage.alt = image.alt;
        expandedImage.style.display = "block";
        expandedVideo.style.display = "none";
        expandedVideo.pause();
    }

    modal.style.display = "flex";
}


/* =========================================
   CLOSE MODAL
   ========================================= */

function closeModal(event) {
    const modal =
        document.getElementById("image-modal");
    const expandedVideo =
        document.getElementById("expanded-video");

    if (
        event.target === modal ||
        event.target.classList.contains("modal-close")
    ) 
	{
		expandedVideo.pause();
        modal.style.display = "none";

    }

}


/* =========================================ESC KEY CLOSES MODAL========================================= */

document.addEventListener(
    "keydown",
    function(event) {
        if (event.key === "Escape") {
            const modal =
                document.getElementById("image-modal");
            const expandedVideo =
                document.getElementById("expanded-video");
            expandedVideo.pause();
            modal.style.display = "none";
        }

    }
);

</script>
