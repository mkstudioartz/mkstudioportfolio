<!-- *********** PHOTOGRAPHY PAGE ENDS *********** -->


<script>
document.addEventListener("DOMContentLoaded", function () {

    const photos = Array.from(
        document.querySelectorAll(".photo-item")
    );

    const lightbox = document.getElementById("photo-lightbox");
    const expanded = document.getElementById("photo-expanded");
    const caption = document.getElementById("photo-caption");
    const counter = document.getElementById("photo-counter");

    const closeButton = document.getElementById("photo-close");
    const prevButton = document.getElementById("photo-prev");
    const nextButton = document.getElementById("photo-next");

    let currentIndex = 0;
    let lastFocusedElement = null;

    function showPhoto(index) {

        currentIndex = (index + photos.length) % photos.length;

        const image = photos[currentIndex].querySelector("img");

        expanded.src = image.src;
        expanded.alt = image.alt;

        caption.textContent = image.alt;

        counter.textContent =
            (currentIndex + 1) + " / " + photos.length;
    }

    function openPhoto(index) {

        lastFocusedElement = document.activeElement;

        showPhoto(index);

        lightbox.classList.add("active");
        lightbox.setAttribute("aria-hidden", "false");

        document.body.style.overflow = "hidden";

        closeButton.focus();
    }

    function closePhoto() {

        lightbox.classList.remove("active");
        lightbox.setAttribute("aria-hidden", "true");

        document.body.style.overflow = "";

        expanded.removeAttribute("src");

        if (lastFocusedElement) {
            lastFocusedElement.focus();
        }
    }

    photos.forEach(function (photo, index) {

        photo.addEventListener("click", function () {
            openPhoto(index);
        });

    });

    closeButton.addEventListener("click", closePhoto);

    prevButton.addEventListener("click", function () {
        showPhoto(currentIndex - 1);
    });

    nextButton.addEventListener("click", function () {
        showPhoto(currentIndex + 1);
    });

    lightbox.addEventListener("click", function (event) {

        if (event.target === lightbox) {
            closePhoto();
        }

    });

    document.addEventListener("keydown", function (event) {

        if (!lightbox.classList.contains("active")) {
            return;
        }

        if (event.key === "Escape") {
            closePhoto();
        }

        if (event.key === "ArrowLeft") {
            showPhoto(currentIndex - 1);
        }

        if (event.key === "ArrowRight") {
            showPhoto(currentIndex + 1);
        }

        if (event.key === "Tab") {

            const controls = [
                closeButton,
                prevButton,
                nextButton
            ];

            const position = controls.indexOf(
                document.activeElement
            );

            if (event.shiftKey && position <= 0) {
                event.preventDefault();
                nextButton.focus();
            } else if (!event.shiftKey &&
                       (position === controls.length - 1 ||
                        position === -1)) {
                event.preventDefault();
                closeButton.focus();
            }
        }

    });

});
</script>
