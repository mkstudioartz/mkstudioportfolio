 <!-- *********** PHOTOGRAPHY GALLERY *********** -->

    <section class="photography-gallery" aria-label="Photography gallery">

        <!-- PHOTO 1 -->
        <button type="button" class="photo-item"
                aria-label="View photograph 1">
            <img src="GraphicDesign/Sabura&BobcatBusinessCard.jpg"
                 alt="Sabura & Bobcat Travel Independent Travel Agents Business Cards"
                 loading="lazy">
            <span class="photo-overlay">View Photo</span>
        </button>

        <!-- PHOTO 2 -->
        <button type="button" class="photo-item"
                aria-label="View photograph 2">
            <img src="GraphicDesign/MKStudioOldBusinessCard.jpg"
                 alt="Mk Studio Business Card"
                 loading="lazy">
            <span class="photo-overlay">View Photo</span>
        </button>

        <!-- PHOTO 3 -->
        <button type="button" class="photo-item"
                aria-label="View photograph 3">
            <img src="GraphicDesign/BobcatGrassCuttingBusinessCard.jpg"
                 alt="Bobcat Grass Cutting Business Card"
                 loading="lazy">
            <span class="photo-overlay">View Photo</span>

		        <!-- PHOTO 14 -->
        <button type="button" class="photo-item"
                aria-label="View photograph 14">
            <img src="GraphicDesign/MKPhotographyLogo.jpg"
                 alt="MK Photography Logo"
                 loading="lazy">
            <span class="photo-overlay">View Photo</span>

		        <!-- PHOTO 16 -->

        </button>
    </section>


    <!-- *********** LIGHTBOX *********** -->

    <div class="photo-lightbox"
         id="photo-lightbox"
         role="dialog"
         aria-modal="true"
         aria-label="Photograph viewer"
         aria-hidden="true">

        <button type="button"
                class="photo-lightbox-close"
                id="photo-close"
                aria-label="Close photograph">
            &times;
        </button>

        <button type="button"
                class="photo-lightbox-prev"
                id="photo-prev"
                aria-label="Previous photograph">
            &#10094;
        </button>

        <div class="photo-lightbox-content">
            <img id="photo-expanded" src="" alt="">
            <p id="photo-caption"></p>
            <p id="photo-counter"></p>
        </div>

        <button type="button"
                class="photo-lightbox-next"
                id="photo-next"
                aria-label="Next photograph">
            &#10095;
        </button>

    </div>


    <!-- *********** BACK TO PORTFOLIO *********** -->
	
	<div class="photography-bottom">

        <a href="portfolio.html" class="photo-back-button">
            &larr; Back to Portfolio
        </a>

    </div>
	
</main>
<script>
	function openModal(item) {

		const image = item.querySelector("img");

		const modal = document.getElementById("image-modal");

		const expandedImage = document.getElementById("expanded-image");

		expandedImage.src = image.src;
		expandedImage.alt = image.alt;

		modal.style.display = "flex";
	}


	function closeModal() {

		document.getElementById("image-modal").style.display = "none";

	}
</script>
